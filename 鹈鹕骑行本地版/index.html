  <section class="controls" aria-label="动画控制">
    <div class="control-left">
      <button class="play-button" id="play-toggle" type="button" aria-label="暂停动画" title="暂停 / 继续（空格键）"><svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 4 13 8-13 8Z"/></svg></button>
      <div><div class="status-title" id="status-title" aria-live="polite">迎着海风，悠闲巡航</div><div class="status-caption">没有目的地，也是一段好旅程。</div></div>
    </div>
    <div class="control-right"><label class="speed-control" for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="骑行速度"><output id="speed-value" for="speed">1.0×</output></label>
      <button class="theme-button" id="theme-toggle" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 17h18M5 21h14M6 14a6 6 0 0 1 12 0M12 2v3M3 7l2 2M21 7l-2 2"/></svg><span id="theme-text">切换日落</span></button>
    </div>
  </section>
  <footer class="footer"><span>慢一点，风景刚刚好。</span><span>纯 SVG 绘制 &nbsp; · &nbsp; 离线也有好风景</span></footer>
  <noscript><p>请启用浏览器 JavaScript 以播放动画；当前仍可欣赏完整 SVG 插画。</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const svgNS = 'http://www.w3.org/2000/svg';
  ['rear-spokes','front-spokes'].forEach(id => {
    for(let i=0;i<16;i++){
      const angle = i*Math.PI/8, spoke = document.createElementNS(svgNS,'line');
      spoke.setAttribute('x1',Math.cos(angle)*8); spoke.setAttribute('y1',Math.sin(angle)*8);
      spoke.setAttribute('x2',Math.cos(angle)*73); spoke.setAttribute('y2',Math.sin(angle)*73);
      $(id).appendChild(spoke);
    }
    const reflector=document.createElementNS(svgNS,'rect');
    Object.entries({x:42,y:-4,width:14,height:8,rx:3,fill:'#e6b96c',stroke:'none'}).forEach(([k,v])=>reflector.setAttribute(k,v));
    $(id).appendChild(reflector);
  });
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  let running=!reducedMotion.matches, speed=1, time=0, previous=null;
  const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
  const transform=(id,value)=>{const el=$(id); if(el)el.setAttribute('transform',value);};
  // Two-segment inverse kinematics keep both webbed feet attached to opposite pedals.
  function legPath(hipX,hipY,x,y){
    const dx=x-hipX,dy=y-hipY,d=clamp(Math.hypot(dx,dy),1,159.9),upper=77,lower=84;
    const a=(upper*upper-lower*lower+d*d)/(2*d),h=Math.sqrt(Math.max(0,upper*upper-a*a));
    const kx=hipX+dx*a/d+dy*h/d,ky=hipY+dy*a/d-dx*h/d;
    return `M${hipX.toFixed(2)} ${hipY.toFixed(2)}Q${(hipX+5).toFixed(2)} ${(hipY+16).toFixed(2)} ${kx.toFixed(2)} ${ky.toFixed(2)}L${x.toFixed(2)} ${y.toFixed(2)}`;
  }
  function draw(t){
    const crank=t*3.5,deg=crank*180/Math.PI,wheelDeg=t*5.3*180/Math.PI;
    const bob=Math.sin(crank*2)*1.5,breath=Math.sin(crank)*1.1;
    transform('rear-spokes',`rotate(${wheelDeg})`);transform('front-spokes',`rotate(${wheelDeg})`);
    transform('crank',`rotate(${deg} 553 459)`);
    transform('pelican',`translate(0 ${bob+breath}) rotate(${Math.sin(crank)*.28} 550 330)`);
    transform('scarf-tail',`rotate(${Math.sin(t*7)*5} 629 230)`);
    const px=553+31*Math.cos(crank),py=459+31*Math.sin(crank),qx=1106-px,qy=918-py;
    const path=legPath(556,334+bob+breath,px,py-5);
    $('near-leg-outline').setAttribute('d',path);$('near-leg-path').setAttribute('d',path);
    $('far-leg-path').setAttribute('d',legPath(548,333+bob+breath,qx,qy-4));
    $('far-foot').setAttribute('d',`M${qx-14} ${qy-5}h27l10 8h-37Z`);
    transform('pedal-front',`translate(${px} ${py})`);transform('pedal-back',`translate(${qx} ${qy})`);
    const blink=t%5.7;
    transform('eye',`translate(0 154) scale(1 ${blink>5.49&&blink<5.65?.08:1}) translate(0 -154)`);
    transform('wind',`translate(${-((t*55)%70)} 0)`);$('wind').setAttribute('opacity',.3+.35*Math.sin(t*1.5)**2);
    transform('distant-birds',`translate(${-((t*4)%50)} ${Math.sin(t*.7)*4})`);
    // Scenery patterns are moved by one tile, so their loop is continuous.
    const road=$('road-motion-pattern');if(road)road.setAttribute('patternTransform',`translate(${-((t*445.2)%160)} 0)`);
    const glints=$('sea-motion-pattern');if(glints)glints.setAttribute('patternTransform',`translate(${-((t*14)%240)} 0)`);
    const clouds=$('cloud-motion-pattern');if(clouds)clouds.setAttribute('patternTransform',`translate(${-((t*8)%1400)} 0)`);
  }
  function updatePlayback(){
    document.body.classList.toggle('paused',!running);
    $('play-toggle').setAttribute('aria-label',running?'暂停动画':'继续动画');
    $('status-title').textContent=running?'迎着海风，悠闲巡航':'停一小会儿，看看海';
  }
  function togglePlayback(){running=!running;previous=null;updatePlayback();}
  $('play-toggle').addEventListener('click',togglePlayback);
  $('speed').addEventListener('input',event=>{speed=Number(event.target.value);$('speed-value').value=`${speed.toFixed(speed%0.5===0?1:2)}×`;});
  $('theme-toggle').addEventListener('click',()=>{
    const sunset=document.body.classList.toggle('sunset');
    $('theme-toggle').setAttribute('aria-pressed',String(sunset));$('theme-text').textContent=sunset?'切换晴日':'切换日落';$('weather-text').textContent=sunset?'落日余晖':'晴日微风';
  });
  document.addEventListener('keydown',event=>{
    if(event.code==='Space'&&!event.repeat&&!event.target.closest('button,input,textarea,select,[contenteditable]')){event.preventDefault();togglePlayback();}
  });
  document.addEventListener('visibilitychange',()=>{previous=null;});
  reducedMotion.addEventListener('change',event=>{if(event.matches){running=false;previous=null;updatePlayback();}});
  function animate(timestamp){
    if(previous!==null&&running&&!document.hidden)time+=Math.min((timestamp-previous)/1000,.05)*speed;
    previous=timestamp;if(running)draw(time);requestAnimationFrame(animate);
  }
  updatePlayback();draw(0);requestAnimationFrame(animate);
})();
</script>
</body>
</html>
