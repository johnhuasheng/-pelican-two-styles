<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f1e8">
<title>鹈鹕的海边慢骑 · Pelican Coast Club</title>
<style>
  :root{color-scheme:light;--paper:#f5f1e8;--ink:#264a46;--muted:#75817a;--line:#d9ded1;--orange:#dc7651}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:38px 28px}
  button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #dc7651;outline-offset:5px}
  .app{width:min(1120px,100%)}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 4px 27px}
  .brand{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:750;letter-spacing:2.2px;line-height:1.6}
  .brand svg{width:40px;height:40px;flex:none}.brand span{display:block}
  .edition{font-size:11px;letter-spacing:1.6px;color:var(--muted)}
  .stage{position:relative;border:1px solid #d4ddd1;border-radius:22px;overflow:hidden;box-shadow:0 18px 52px -36px #244f444f;background:#eaf0e4}
  .scene{display:block;width:100%;height:auto}
  .live{position:absolute;right:27px;top:25px;display:flex;gap:7px;align-items:center;font-size:10px;letter-spacing:1.8px;color:#46645b}
  .live i{width:6px;height:6px;background:#668f68;border-radius:50%;display:block}.live.paused i{background:#ac9174}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 4px 21px;border-bottom:1px solid var(--line)}
  .controls{display:flex;gap:10px;align-items:center}
  .button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;border:1px solid #cdd5ca;border-radius:30px;background:transparent;color:var(--ink);padding:0 18px;font-size:13px;transition:background .18s,transform .18s}
  .button:hover{background:#e7ebdf}.button:active{transform:translateY(1px)}.button svg{height:17px;width:17px;flex:none}
  .primary{background:var(--ink);border-color:var(--ink);color:#fffdf3;min-width:117px}.primary:hover{background:#35665e}.bell:hover{background:#f4dfce;border-color:#dfb494}
  .speed{display:flex;align-items:center;gap:14px;color:#5a6f64;font-size:12px}.speed input{width:135px;height:20px;accent-color:var(--ink);cursor:pointer}.speed output{font-variant-numeric:tabular-nums;min-width:34px;color:var(--ink);font-weight:650}
  footer{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px 4px 0;color:#819084;font-size:11px;letter-spacing:.4px}footer .dot{color:#c68b64;margin:0 9px}.keyboard{letter-spacing:0;font-size:10px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:640px){body{padding:25px 16px;align-items:flex-start}.app{margin-top:5vh}header{margin-bottom:19px}.edition{font-size:9px;letter-spacing:1px}.brand{font-size:9px;letter-spacing:1.5px;gap:8px}.brand svg{width:33px;height:33px}.stage{border-radius:16px}.scene{width:150%;max-width:none;transform:translateX(-16.6667%)}.live{top:15px;right:14px;font-size:8px;gap:5px}.toolbar{flex-wrap:wrap;gap:18px;padding:20px 1px}.controls{width:100%;justify-content:center}.speed{width:100%;justify-content:center}.speed input{width:160px}.button{min-height:46px}.keyboard{display:none}footer{justify-content:center;font-size:10px;text-align:center;line-height:1.8;padding-top:17px}}
  @media(max-width:640px){.scene-heading{transform:translateX(160px)}.scene-caption{display:none}}

  body{transition:background 1.6s,color 1.6s}
  body.sunset{--paper:#f5e9df;--ink:#514a51;--muted:#8c7c80;--line:#dfcfc3}
  .live{z-index:1;pointer-events:none}
  .interactive{cursor:pointer;touch-action:manipulation}
  .interactive:focus-visible{outline:none;filter:drop-shadow(0 0 5px #edb565)}
  .surprises{padding:20px 4px 17px;border-bottom:1px solid var(--line)}
  .surprise-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .surprise-title{font-size:12px;white-space:nowrap;letter-spacing:1px}
  .surprise-title span{font-size:10px;margin-left:8px;color:var(--muted);letter-spacing:0}
  .small-actions{display:flex;gap:7px}.small-actions .button{min-height:37px;padding:0 13px;font-size:11px;gap:7px}.small-actions svg{width:16px;height:16px}
  .note{font-size:12px;line-height:1.7;color:var(--muted);min-height:21px;margin:14px 0 12px}
  .discoveries{display:flex;flex-wrap:wrap;gap:8px}
  .discovery{font-size:10px;color:#92978a;letter-spacing:.5px;border:1px dashed #d1d6c7;padding:5px 10px;border-radius:4px}
  .discovery::before{content:'○';margin-right:5px}.discovery.found{color:#956b3d;border:1px solid #dcc4a0;background:#efe2c9}.discovery.found::before{content:'✓'}
  .button[aria-pressed="true"]:not(.primary){background:#f0dbc5;border-color:#d4b995}
  @media(max-width:640px){.surprise-top{flex-direction:column;align-items:stretch;gap:12px}.small-actions{justify-content:center}.small-actions .button{flex:1;padding:0 8px;min-height:42px}.surprise-title{text-align:center}.note{text-align:center;min-height:40px}.discoveries{justify-content:center;gap:5px}.discovery{font-size:9px;padding:5px 7px}}

  .small-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:440px;flex:none;gap:8px}
  .small-actions .button{padding:0 10px;white-space:nowrap;min-height:39px}
  .button:disabled{opacity:.55;cursor:wait;transform:none}
  @media(max-width:850px){.surprise-top{flex-direction:column;align-items:stretch;gap:14px}.surprise-title{text-align:center}.small-actions{width:100%;max-width:480px;margin:auto}}
  @media(max-width:640px){.small-actions .button{min-height:43px;padding:0 6px;font-size:11px}.discoveries{gap:6px}}

  dialog{width:min(810px,calc(100% - 28px));max-height:92svh;overflow:auto;padding:22px;border:1px solid #d5d7c5;border-radius:20px;background:#f8f2e6;color:#31554a;box-shadow:0 24px 90px #153a4855}
  dialog::backdrop{background:#203e4594;backdrop-filter:blur(4px)}
  .card-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}.card-heading h2{font-size:18px;margin:0;font-weight:600}.card-heading .button{padding:0 13px;min-height:35px}
  #postcardPreview{display:block;width:100%;height:auto;border-radius:9px;border:1px solid #ded6c3;background:#f5f1e8}
  .caption-field{display:flex;align-items:center;gap:12px;margin:17px 0 14px;font-size:12px}.caption-field input{flex:1;min-width:0;background:#fffcf3;border:1px solid #d9d9c7;border-radius:9px;padding:11px 12px;color:#31554a;font-size:13px}
  .card-actions{display:flex;gap:10px;flex-wrap:wrap}.card-actions a{text-decoration:none;font-size:12px}.card-actions button{font-size:12px}
  #exportHint{font-size:11px;color:#7c8576;line-height:1.6;margin-bottom:0}
  @media(max-width:640px){dialog{padding:16px}.card-heading h2{font-size:16px}.caption-field{align-items:flex-start;flex-direction:column;gap:7px}.caption-field input{width:100%}.card-actions .button{flex:1;padding:0 9px}}
  @media(prefers-reduced-motion:reduce){body,.button{transition:none}}

</style>
</head>

      setTimeout(()=>URL.revokeObjectURL(url),60000);
      $('exportHint').textContent='图片已生成并开始下载。若手机打开了图片预览，可长按保存。';
    }catch(_){$('exportHint').textContent='当前浏览器未能生成 PNG。你仍可以点“保存矢量图（SVG）”保留这张明信片。';}
    finally{URL.revokeObjectURL(imageURL);button.disabled=false;button.textContent='保存图片（PNG）';}
  });

  // Two bones meet at the knee; the ankle remains fixed to the pedal at all angles.
  function leg(hipX, hipY, footX, footY, upper, lower) {
    const dx = footX - hipX, dy = footY - hipY;
    const distance = Math.max(0.001, Math.hypot(dx, dy));
    const a = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const h = Math.sqrt(Math.max(0, upper * upper - a * a));
    const kneeX = hipX + a * dx / distance + h * dy / distance;
    const kneeY = hipY + a * dy / distance - h * dx / distance;
    return `M${hipX.toFixed(2)} ${hipY.toFixed(2)}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${footX.toFixed(2)} ${footY.toFixed(2)}`;
  }
  function draw(t, now) {
    const phase = t * 2.8;
    const degrees = phase * 180 / Math.PI;
    const bob = Math.sin(phase * 2) * 1.7;
    // A 2.05 gear ratio connects pedaling, wheels and the passing road.
    const travel = phase * 2.05 * 87;
    refs.rearSpokes.setAttribute('transform',`rotate(${degrees*2.05})`);
    refs.frontSpokes.setAttribute('transform',`rotate(${degrees*2.05})`);
    refs.crankSpin.setAttribute('transform',`rotate(${degrees} 565 470)`);
    const nearX=565+30*Math.cos(phase), nearY=470+30*Math.sin(phase);
    const farX=565-30*Math.cos(phase), farY=470-30*Math.sin(phase);
    const nearPath=leg(550,329+bob,nearX,nearY-4,89,103);
    const farPath=leg(541,327+bob,farX,farY-4,87,105);
    refs.nearLeg.setAttribute('d',nearPath); refs.nearLegHighlight.setAttribute('d',nearPath);
    refs.farLeg.setAttribute('d',farPath); refs.farLegHighlight.setAttribute('d',farPath);
    refs.farCrank.setAttribute('d',`M565 470L${farX} ${farY}`);
    refs.nearFoot.setAttribute('transform',`translate(${nearX} ${nearY-8})`);
    refs.farFoot.setAttribute('transform',`translate(${farX} ${farY-8})`);
    // Tiny bounce is centered at the wingtip to keep the hand at the handlebar.
    refs.pelican.setAttribute('transform',`rotate(${-bob*.36} 674 293)`);
    refs.scarfTail.setAttribute('d',`M576 232C546 ${226+Math.sin(phase*1.9)*8} 530 ${207+Math.cos(phase*1.7)*7} 497 ${221+Math.sin(phase*2)*10}L508 ${233+Math.sin(phase*2)*10}L495 ${245+Math.sin(phase*2)*9}C528 ${239+Math.cos(phase*1.7)*7} 548 ${257+Math.sin(phase*1.9)*6} 579 251Z`);
    refs.shadow.setAttribute('rx',259+Math.sin(phase*2)*2);
    refs.clouds.setAttribute('transform',`translate(${-wrap(t*7,1400)} 0)`);
    // Clouds repeat their complete tile to avoid gaps during long playback.
    cloudRepeat.setAttribute('transform',`translate(${1400-wrap(t*7,1400)} 0)`);
    refs.island.setAttribute('transform',`translate(${-wrap(t*9+210,1550)+210} 0)`);
    refs.birds.setAttribute('transform',`translate(${Math.sin(t*.35)*15} ${Math.sin(t*1.2)*4})`);
    refs.speedLines.setAttribute('opacity',.34+Math.sin(phase*2)*.13);
    waves.forEach(o=>o.el.setAttribute('transform',`translate(${wrap(o.x-travel*.11+100,1400)-100} ${o.y})`));
    plants.forEach(o=>o.el.setAttribute('transform',`translate(${wrap(o.x-travel*.36+100,1550)-100} ${o.y}) scale(.7)`));
    road.forEach(o=>o.el.setAttribute('transform',`translate(${wrap(o.x-travel+100,1580)-100} ${o.y})`));
    nearPlants.forEach(o=>o.el.setAttribute('transform',`translate(${wrap(o.x-travel+100,1690)-100} ${o.y})`));
    const blink=wrap(t,5.7)>5.5;
    refs.eye.setAttribute('opacity',blink?0:1); refs.eyeClosed.setAttribute('opacity',blink?1:0);
    const bellAge=(now-bellStart)/1000;
    const bellOpacity=bellAge>=0&&bellAge<1.15 ? Math.min(1,bellAge*12,(1.15-bellAge)*4) : 0;
    refs.bellWaves.setAttribute('opacity',bellOpacity);
    refs.bellNote.setAttribute('opacity',bellOpacity);
    refs.bellNote.setAttribute('transform',`translate(738 ${258-Math.min(Math.max(bellAge,0),1.2)*12})`);
    drawExtras(t,now);
    drawAdventure(t);
    drawStory();
  }
  // Clone only the cloud geometry; no duplicate IDs.
  const cloudRepeat=refs.clouds.cloneNode(true);
  cloudRepeat.removeAttribute('id');
  refs.clouds.parentNode.insertBefore(cloudRepeat,refs.clouds.nextSibling);

  function syncPlayButton() {
    $('pauseIcon').style.display=paused?'none':'';
    $('playIcon').style.display=paused?'':'none';
    $('playLabel').textContent=paused?'继续出发':'歇一会儿';
    $('play').setAttribute('aria-label',paused?'播放动画':'暂停动画');
    $('play').setAttribute('aria-pressed',String(paused));
    $('live').classList.toggle('paused',paused);
    $('liveText').textContent=paused?'TAKE A BREAK':'ON THE ROAD';
  }
  function togglePlay(){paused=!paused;syncPlayButton();$('status').textContent=paused?'动画已暂停。':'继续骑行。';}
  $('play').addEventListener('click',togglePlay);
  $('speed').addEventListener('input',event=>{
    speed=Number(event.target.value);
    $('speedValue').textContent=speed.toFixed(1)+'×';
    $('speed').setAttribute('aria-valuetext',speed.toFixed(1)+' 倍速');
  });
  async function ringBell() {
    wakeForEncounter();bellStart=effectTime*1000-(reduceMotion.matches?150:0);
    callCrab();
    try {
      const Audio=window.AudioContext||window.webkitAudioContext;
      if(!Audio)return;
      audioContext ||= new Audio();
      if(audioContext.state==='suspended')await audioContext.resume();
      if(audioContext.state!=='running')return;
      const start=audioContext.currentTime;
      [0,.13].forEach(delay=>{
        [1650,2475].forEach((frequency,index)=>{
          const osc=audioContext.createOscillator(), gain=audioContext.createGain();
          osc.type='sine';osc.frequency.value=frequency;
          gain.gain.setValueAtTime(0,start+delay);
          gain.gain.linearRampToValueAtTime(index?.035:.075,start+delay+.006);
          gain.gain.exponentialRampToValueAtTime(.0001,start+delay+.65);
          osc.connect(gain);gain.connect(audioContext.destination);
          osc.start(start+delay);osc.stop(start+delay+.7);
          osc.onended=()=>{osc.disconnect();gain.disconnect();};
        });
      });
    } catch (_) { /* Visual bell feedback remains available without audio. */ }
  }
  $('bell').addEventListener('click',ringBell);
  document.addEventListener('keydown',event=>{
    if(event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;
    if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(event.target.tagName)||event.target.isContentEditable)return;
    if(event.code==='Space'){event.preventDefault();togglePlay();}
    if(event.key.toLowerCase()==='b')ringBell();
    if(event.key.toLowerCase()==='f')jumpFish();
    if(event.key.toLowerCase()==='s')toggleSunset();
    if(event.key.toLowerCase()==='h')changeHat();
    if(event.key.toLowerCase()==='j')hop();
  });
  document.addEventListener('visibilitychange',()=>{last=null;extraLast=null;});
  if(reduceMotion.addEventListener)reduceMotion.addEventListener('change',event=>{
    if(event.matches){paused=true;syncPlayButton();}
  });
  function frame(now){
    if(last!==null&&!paused&&!document.hidden){const dt=Math.min((now-last)/1000,.05);time+=dt*speed;effectTime+=dt;}
    last=now;
    draw(time,effectTime*1000);
    requestAnimationFrame(frame);
  }
  syncPlayButton();
  draw(0,0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
